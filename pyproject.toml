[project]
name = "maibot-plugin-live-dashboard"
version = "1.2.1"
description = "Unofficial full-feature MaiBot port of Pancakes-Labs Live Dashboard"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.16.0,<3", "httpx>=0.27,<1", "aiohttp>=3.9,<4", "tzdata>=2024.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
